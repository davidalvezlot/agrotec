<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Tarea</title>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  padding:25px;
  border-radius:15px;
  width:360px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  text-align:center;
}

h2{
  margin-bottom:10px;
}

.estado{
  padding:5px 10px;
  border-radius:10px;
  color:white;
  display:inline-block;
  margin-top:10px;
}

.en_proceso{
  background:orange;
}

.disponible{
  background:gray;
}

.finalizada{
  background:green;
}

.card{
  margin-top:20px;
  text-align:left;
}

.card p{
  margin:8px 0;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.iniciar{
  background:#3498db;
}

.finalizar{
  background:#2ecc71;
}

.problema{
  background:#e74c3c;
}

button:disabled{
  background:gray;
  cursor:not-allowed;
}

.progreso-box{
  margin-top:15px;
}

.barra{
  width:100%;
  height:20px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
}

.progreso{
  height:100%;
  width:0%;
  background:#2ecc71;
  transition:0.5s;
}

.texto-progreso{
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

  <h2 id="saludo">Hola</h2>

  <div class="card" id="info"></div>

  <div class="progreso-box">

    <div class="barra">
      <div class="progreso" id="barraProgreso"></div>
    </div>

    <div class="texto-progreso" id="textoProgreso">
      Esperando inicio
    </div>

  </div>

  <button
    class="iniciar"
    id="btnIniciar"
    onclick="iniciar()">

    Iniciar tarea

  </button>

  <button
    class="finalizar"
    id="btnFinalizar"
    onclick="finalizar()">

    Finalizar tarea

  </button>

  <button
    class="problema"
    onclick="reportarProblema()">

    Hubo algún problema

  </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";


// FIREBASE
const app = initializeApp({

  apiKey: "TU_API_KEY",
  authDomain: "agrotecdb.firebaseapp.com",
  projectId: "agrotecdb"

});

const db = getFirestore(app);


// PARAMETROS
const params = new URLSearchParams(window.location.search);

const actId = params.get("actId");
const nombre = params.get("nombre");


// ELEMENTOS
const info = document.getElementById("info");

const saludo = document.getElementById("saludo");

const barra = document.getElementById("barraProgreso");

const textoProgreso =
document.getElementById("textoProgreso");

const btnIniciar =
document.getElementById("btnIniciar");

const btnFinalizar =
document.getElementById("btnFinalizar");


let actividadData = null;

let intervalo = null;


// CARGAR
async function cargar(){

  saludo.innerHTML = `Hola, ${nombre}`;

  const ref =
  doc(db,"actividades",actId);

  const snap =
  await getDoc(ref);

  if(!snap.exists()){

    info.innerHTML =
    "Actividad no encontrada";

    return;

  }

  actividadData = snap.data();

  const estadoClase =
  actividadData.estado || "disponible";

  info.innerHTML = `

    <p>
      <strong>Actividad:</strong>
      ${actividadData.nombre}
    </p>

    <p>
      <strong>Trabajador:</strong>
      ${actividadData.trabajador}
    </p>

    <p>
      <strong>Zona:</strong>
      ${actividadData.zona}
    </p>

    <p>
      <strong>Duración:</strong>
      ${actividadData.duracionHoras || 2} horas
    </p>

    <div class="estado ${estadoClase}">
      ${estadoClase.toUpperCase()}
    </div>

  `;


  // SI YA ESTA FINALIZADA
  if(actividadData.estado === "finalizada"){

    barra.style.width = "100%";

    textoProgreso.innerHTML =
    "Actividad completada";

    btnIniciar.disabled = true;

    btnFinalizar.disabled = true;

    return;

  }


  // SI YA ESTA INICIADA MANUALMENTE
  if(actividadData.iniciada === true){

    btnIniciar.disabled = true;

    btnFinalizar.disabled = false;

    iniciarContador();

  }else{

    // NO INICIADA
    barra.style.width = "0%";

    textoProgreso.innerHTML =
    "Esperando inicio";

    btnIniciar.disabled = false;

    btnFinalizar.disabled = true;

  }

}

cargar();


// INICIAR
window.iniciar = async () => {

  if(actividadData.iniciada === true){
    return;
  }

  const ahora =
  new Date().toISOString();

  await updateDoc(

    doc(db,"actividades",actId),

    {

      iniciada:true,

      estado:"en_proceso",

      fechaInicio:ahora,

      progreso:0,

      tiempoTranscurrido:0

    }

  );

  actividadData.iniciada = true;

  actividadData.fechaInicio = ahora;

  actividadData.estado = "en_proceso";

  btnIniciar.disabled = true;

  btnFinalizar.disabled = false;

  iniciarContador();

  alert("Actividad iniciada");

};


// CONTADOR
function iniciarContador(){

  if(intervalo){

    clearInterval(intervalo);

  }

  intervalo = setInterval(async()=>{

    const inicio =
    new Date(
      actividadData.fechaInicio
    ).getTime();

    const ahora =
    new Date().getTime();

    const transcurrido =
    Math.floor(
      (ahora - inicio)/1000
    );

    const duracionSegundos =
    (actividadData.duracionHoras || 2)
    * 3600;

    let porcentaje =
    Math.floor(
      (transcurrido/duracionSegundos)
      * 100
    );

    if(porcentaje > 100){

      porcentaje = 100;

    }

    barra.style.width =
    porcentaje + "%";

    textoProgreso.innerHTML =
    porcentaje + "% completado";

    await updateDoc(

      doc(db,"actividades",actId),

      {

        progreso:porcentaje,

        tiempoTranscurrido:
        transcurrido

      }

    );

    if(porcentaje >= 100){

      clearInterval(intervalo);

    }

  },1000);

}


// FINALIZAR
window.finalizar = async()=>{

  if(
    actividadData.iniciada !== true
  ){

    alert(
      "Primero debes iniciar la tarea"
    );

    return;

  }

  clearInterval(intervalo);

  const horas =
  actividadData.duracionHoras || 2;

  await updateDoc(

    doc(db,"actividades",actId),

    {

      estado:"finalizada",

      fechaFin:
      new Date().toISOString(),

      progreso:100

    }

  );


  // SUMAR HORAS
  if(actividadData.usuarioId){

    await updateDoc(

      doc(
        db,
        "usuarios",
        actividadData.usuarioId
      ),

      {

        horasHoy:
        increment(horas),

        actividadesHoy:
        increment(1),

        ultimoProgreso:100

      }

    );

  }


  // LIBERAR RECURSO
  if(actividadData.recursoId){

    await updateDoc(

      doc(
        db,
        "recursos",
        actividadData.recursoId
      ),

      {

        estado:"disponible",

        asignadoA:"",

        nombreAsignado:"",

        rolAsignado:""

      }

    );

  }

  barra.style.width = "100%";

  textoProgreso.innerHTML =
  "Actividad completada";

  btnFinalizar.disabled = true;

  alert("Actividad finalizada");

};


// PROBLEMA
window.reportarProblema = ()=>{

  window.location.href =

  `problema.html?actId=${actId}&nombre=${nombre}`;

};

</script>

</body>
</html>
