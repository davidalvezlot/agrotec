<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Tarea</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 360px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  text-align: center;
}

h2 {
  margin-bottom: 10px;
}

.estado {
  padding: 5px 10px;
  border-radius: 10px;
  color: white;
  display: inline-block;
  margin-top: 10px;
}

.en_proceso { background: orange; }
.disponible { background: gray; }
.finalizada { background: green; }

.card {
  margin-top: 20px;
  text-align: left;
}

.card p {
  margin: 8px 0;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

.iniciar { background: #3498db; }
.finalizar { background: #2ecc71; }
.problema { background: #e74c3c; }

button:disabled {
  background: gray;
}

.progreso-box{
  margin-top:15px;
}

.barra{
  width:100%;
  height:20px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
}

.progreso{
  height:100%;
  width:0%;
  background:#2ecc71;
  transition:0.5s;
}

.texto-progreso{
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <h2 id="saludo">Hola</h2>

  <div class="card" id="info"></div>

  <!-- PROGRESO -->
  <div class="progreso-box">

    <div class="barra">
      <div class="progreso" id="barraProgreso"></div>
    </div>

    <div class="texto-progreso" id="textoProgreso">
      0%
    </div>

  </div>

  <button class="iniciar" id="btnIniciar" onclick="iniciar()">
    Iniciar tarea
  </button>

  <button class="finalizar" id="btnFinalizar" onclick="finalizar()">
    Finalizar tarea
  </button>

  <button class="problema" onclick="reportarProblema()">
    Hubo algún problema
  </button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "TU_API_KEY",
  authDomain: "agrotecdb.firebaseapp.com",
  projectId: "agrotecdb"
});

const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);

const actId = params.get("actId");
const nombre = params.get("nombre");

const info = document.getElementById("info");
const saludo = document.getElementById("saludo");

const barra = document.getElementById("barraProgreso");
const textoProgreso = document.getElementById("textoProgreso");

const btnIniciar = document.getElementById("btnIniciar");
const btnFinalizar = document.getElementById("btnFinalizar");

let actividadData = null;

let intervalo = null;

// CARGAR ACTIVIDAD
async function cargar() {

  saludo.innerHTML = `Hola, ${nombre}`;

  const ref = doc(db, "actividades", actId);

  const snap = await getDoc(ref);

  if (!snap.exists()) {

    info.innerHTML = "Actividad no encontrada";
    return;

  }

  actividadData = snap.data();

  const estadoClase = actividadData.estado;

  info.innerHTML = `

    <p><strong>Actividad:</strong> ${actividadData.nombre}</p>

    <p><strong>Trabajador:</strong> ${actividadData.trabajador}</p>

    <p><strong>Zona:</strong> ${actividadData.zona}</p>

    <p><strong>Duración estimada:</strong>
      ${actividadData.duracionHoras || 2} horas
    </p>

    <p><strong>Inicio:</strong>
      ${actividadData.fechaInicio || "Pendiente"}
    </p>

    <div class="estado ${estadoClase}">
      ${actividadData.estado.toUpperCase()}
    </div>

  `;

  // BOTONES
  if (actividadData.estado === "disponible") {

    btnIniciar.disabled = false;
    btnFinalizar.disabled = true;

  }

  if (actividadData.estado === "en_proceso") {

    btnIniciar.disabled = true;
    btnFinalizar.disabled = false;

    iniciarContador();

  }

  if (actividadData.estado === "finalizada") {

    btnIniciar.disabled = true;
    btnFinalizar.disabled = true;

    barra.style.width = "100%";
    textoProgreso.innerHTML = "Actividad completada";

  }

}

cargar();

// INICIAR ACTIVIDAD
window.iniciar = async () => {

  const ahora = new Date().toISOString();

  await updateDoc(doc(db, "actividades", actId), {

    estado: "en_proceso",

    fechaInicio: ahora,

    progreso: 0

  });

  alert("Actividad iniciada");

  cargar();

};

// CONTADOR EN TIEMPO REAL
function iniciarContador() {

  if (intervalo) clearInterval(intervalo);

  intervalo = setInterval(async () => {

    const inicio = new Date(actividadData.fechaInicio).getTime();

    const ahora = new Date().getTime();

    const transcurrido = (ahora - inicio) / 1000;

    const duracionSegundos =
      (actividadData.duracionHoras || 2) * 3600;

    let porcentaje =
      Math.floor((transcurrido / duracionSegundos) * 100);

    if (porcentaje > 100) porcentaje = 100;

    barra.style.width = porcentaje + "%";

    textoProgreso.innerHTML =
      porcentaje + "% completado";

    // GUARDAR PROGRESO EN FIREBASE
    await updateDoc(doc(db, "actividades", actId), {
      progreso: porcentaje
    });

    if (porcentaje >= 100) {
      clearInterval(intervalo);
    }

  }, 1000);

}

// FINALIZAR ACTIVIDAD
window.finalizar = async () => {

  const horas = actividadData.duracionHoras || 2;

  // FINALIZAR ACTIVIDAD
  await updateDoc(doc(db, "actividades", actId), {

    estado: "finalizada",

    fechaFin: new Date().toISOString(),

    progreso: 100

  });

  // SUMAR HORAS AL USUARIO
  if (actividadData.usuarioId) {

    await updateDoc(
      doc(db, "usuarios", actividadData.usuarioId),
      {

        horasHoy: increment(horas),

        actividadesHoy: increment(1)

      }
    );

  }

  alert("Actividad finalizada");

  barra.style.width = "100%";

  textoProgreso.innerHTML =
    "Actividad completada";

  cargar();

};

// REPORTAR PROBLEMA
window.reportarProblema = () => {

  window.location.href =
    `problema.html?actId=${actId}&nombre=${nombre}`;

};

</script>

</body>
</html>
