<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Tarea</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   GENERAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#eef2f6;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  color:#1e293b;
}

/* =========================
   CONTENEDOR
========================= */

.container{
  width:100%;
  max-width:460px;
  background:#f8f8f9;
  border-radius:30px;
  padding:35px;
  box-shadow:0 10px 30px rgba(15,23,42,0.06);
  border:1px solid #e5e7eb;
}

/* =========================
   TITULOS
========================= */

h2{
  font-size:34px;
  font-weight:800;
  color:#243247;
  margin-bottom:10px;
}

.subtitulo{
  color:#64748b;
  font-size:15px;
  margin-bottom:25px;
}

/* =========================
   CARD
========================= */

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  border:1px solid #edf1f5;
  margin-bottom:22px;
}

.card p{
  margin-bottom:14px;
  font-size:15px;
  color:#334155;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card strong{
  color:#64748b;
  font-weight:600;
}

/* =========================
   UBICACION
========================= */

.ubicacion{
  background:white;
  border-radius:24px;
  padding:20px;
  border:1px solid #edf1f5;
  margin-bottom:22px;
  text-align:center;
}

.estado-ubicacion{
  margin-top:10px;
  font-size:14px;
  font-weight:700;
}

.ok{
  color:#15803d;
}

.error{
  color:#dc2626;
}

/* =========================
   ESTADO
========================= */

.estado{
  margin-top:10px;
  padding:10px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  display:inline-block;
}

.en_proceso{
  background:#edf4ff;
  color:#3563d9;
}

.disponible{
  background:#f1f5f9;
  color:#64748b;
}

.finalizada{
  background:#ecfdf3;
  color:#15803d;
}

/* =========================
   PROGRESO
========================= */

.progreso-box{
  background:white;
  border-radius:24px;
  padding:24px;
  border:1px solid #edf1f5;
  margin-bottom:22px;
}

.progreso-box h3{
  font-size:18px;
  margin-bottom:18px;
  color:#243247;
}

.barra{
  width:100%;
  height:18px;
  background:#e2e8f0;
  border-radius:999px;
  overflow:hidden;
}

.progreso{
  height:100%;
  width:0%;
  background:#243247;
  border-radius:999px;
  transition:0.5s;
}

.texto-progreso{
  margin-top:12px;
  font-size:14px;
  font-weight:600;
  color:#475569;
  text-align:center;
}

/* =========================
   BOTONES
========================= */

button{
  width:100%;
  border:none;
  padding:14px;
  border-radius:16px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  transition:0.2s;
  margin-top:12px;
}

button:hover{
  opacity:0.92;
}

.iniciar{
  background:#243247;
  color:white;
}

.finalizar{
  background:#dbe4f0;
  color:#243247;
}

.problema{
  background:#f1f5f9;
  color:#334155;
}

button:disabled{
  background:#cbd5e1;
  color:#64748b;
  cursor:not-allowed;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .container{
    padding:25px;
    border-radius:24px;
  }

  h2{
    font-size:28px;
  }

}

</style>
</head>

<body>

<div class="container">

  <h2 id="saludo">
    Hola
  </h2>

  <p class="subtitulo">
    Gestión y seguimiento de tareas en tiempo real
  </p>

  <div class="card" id="info"></div>

  <div class="ubicacion">

    <strong>
      Validación de ubicación
    </strong>

    <div
      class="estado-ubicacion"
      id="estadoUbicacion">

      Verificando ubicación...

    </div>

  </div>

  <div class="progreso-box">

    <h3>
      Progreso de actividad
    </h3>

    <div class="barra">

      <div
        class="progreso"
        id="barraProgreso">
      </div>

    </div>

    <div
      class="texto-progreso"
      id="textoProgreso">

      Esperando inicio

    </div>

  </div>

  <button
    class="iniciar"
    id="btnIniciar"
    onclick="iniciar()"
    disabled>

    Iniciar tarea

  </button>

  <button
    class="finalizar"
    id="btnFinalizar"
    onclick="finalizar()">

    Finalizar tarea

  </button>

  <button
    class="problema"
    onclick="reportarProblema()">

    Reportar problema

  </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {

  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment

}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const app = initializeApp({

  apiKey:"TU_API_KEY",

  authDomain:
  "agrotecdb.firebaseapp.com",

  projectId:"agrotecdb"

});

const db = getFirestore(app);


/* =========================
   RANGO TEC PACHUCA
========================= */

const LAT_MIN = 19.95;
const LAT_MAX = 20.25;

const LNG_MIN = -98.95;
const LNG_MAX = -98.60;


/* =========================
   PARAMETROS
========================= */

const params =
new URLSearchParams(window.location.search);

const actId =
params.get("actId");

const nombre =
params.get("nombre");


/* =========================
   ELEMENTOS
========================= */

const info =
document.getElementById("info");

const saludo =
document.getElementById("saludo");

const barra =
document.getElementById("barraProgreso");

const textoProgreso =
document.getElementById("textoProgreso");

const btnIniciar =
document.getElementById("btnIniciar");

const btnFinalizar =
document.getElementById("btnFinalizar");

const estadoUbicacion =
document.getElementById("estadoUbicacion");


let actividadData = null;

let intervalo = null;


/* =========================
   VERIFICAR UBICACION
========================= */

async function verificarUbicacionInicial(){

  return new Promise((resolve)=>{

    navigator.geolocation.getCurrentPosition(

      async(pos)=>{

        const lat =
        pos.coords.latitude;

        const lng =
        pos.coords.longitude;

        console.log(
          "Ubicación real:",
          lat,
          lng
        );

        let estadoFinal =
        "inactivo";

        // MISMO RANGO
        if(

          lat >= LAT_MIN &&
          lat <= LAT_MAX &&

          lng >= LNG_MIN &&
          lng <= LNG_MAX

        ){

          estadoFinal = "activo";

        }

        // ACTUALIZAR USUARIO
        if(
          actividadData &&
          actividadData.usuarioId
        ){

          await updateDoc(

            doc(
              db,
              "usuarios",
              actividadData.usuarioId
            ),

            {

              estadoHoy:
              estadoFinal,

              ultimaAsistencia:
              new Date().toISOString()

            }

          );

        }

        // INTERFAZ
        if(
          estadoFinal === "activo"
        ){

          estadoUbicacion.innerHTML =

          "🟢 Dentro del Tec de Pachuca";

          estadoUbicacion.className =
          "estado-ubicacion ok";

          if(

            actividadData.iniciada !== true &&
            actividadData.estado !== "finalizada"

          ){

            btnIniciar.disabled = false;

          }

        }else{

          estadoUbicacion.innerHTML =

          "🔴 Fuera del Tec de Pachuca";

          estadoUbicacion.className =
          "estado-ubicacion error";

          btnIniciar.disabled = true;

        }

        resolve();

      },

      (error)=>{

        console.error(error);

        estadoUbicacion.innerHTML =

        "Error obteniendo ubicación";

        estadoUbicacion.className =
        "estado-ubicacion error";

        btnIniciar.disabled = true;

        resolve();

      },

      {

        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:0

      }

    );

  });

}


/* =========================
   CARGAR ACTIVIDAD
========================= */

async function cargar(){

  saludo.innerHTML =
  `Hola, ${nombre}`;

  const ref =
  doc(db,"actividades",actId);

  const snap =
  await getDoc(ref);

  if(!snap.exists()){

    info.innerHTML =
    "Actividad no encontrada";

    return;

  }

  actividadData = snap.data();

  const estadoClase =
  actividadData.estado || "disponible";

  info.innerHTML = `

    <p>
      <strong>Actividad</strong>

      <span>
        ${actividadData.nombre}
      </span>
    </p>

    <p>
      <strong>Trabajador</strong>

      <span>
        ${actividadData.trabajador}
      </span>
    </p>

    <p>
      <strong>Zona</strong>

      <span>
        ${actividadData.zona}
      </span>
    </p>

    <p>
      <strong>Duración</strong>

      <span>
        ${actividadData.duracionHoras || 2}
        horas
      </span>
    </p>

    <div class="estado ${estadoClase}">
      ${estadoClase.toUpperCase()}
    </div>

  `;

  btnIniciar.disabled = true;

  await verificarUbicacionInicial();

  // FINALIZADA
  if(
    actividadData.estado ===
    "finalizada"
  ){

    const progreso =
    actividadData.progreso || 0;

    barra.style.width =
    progreso + "%";

    textoProgreso.innerHTML =
    progreso + "% completado";

    btnIniciar.disabled = true;

    btnFinalizar.disabled = true;

    return;

  }

  // EN PROCESO
  if(
    actividadData.iniciada === true
  ){

    btnIniciar.disabled = true;

    btnFinalizar.disabled = false;

    iniciarContador();

  }else{

    barra.style.width = "0%";

    textoProgreso.innerHTML =
    "Esperando inicio";

    btnFinalizar.disabled = true;

  }

}

cargar();


/* =========================
   INICIAR
========================= */

window.iniciar = async()=>{

  if(
    actividadData.iniciada === true
  ){
    return;
  }

  const ahora =
  new Date().toISOString();

  await updateDoc(

    doc(
      db,
      "actividades",
      actId
    ),

    {

      iniciada:true,

      estado:"en_proceso",

      fechaInicio:ahora,

      progreso:0,

      tiempoTranscurrido:0

    }

  );

  actividadData.iniciada = true;

  actividadData.fechaInicio = ahora;

  actividadData.estado = "en_proceso";

  btnIniciar.disabled = true;

  btnFinalizar.disabled = false;

  iniciarContador();

  alert("Actividad iniciada");

};


/* =========================
   CONTADOR
========================= */

function iniciarContador(){

  if(intervalo){

    clearInterval(intervalo);

  }

  intervalo = setInterval(async()=>{

    const inicio =
    new Date(
      actividadData.fechaInicio
    ).getTime();

    const ahora =
    new Date().getTime();

    const transcurrido =
    Math.floor(
      (ahora - inicio)/1000
    );

    const duracionSegundos =

    (
      actividadData.duracionHoras || 2
    ) * 3600;

    let porcentaje =

    Math.floor(

      (
        transcurrido /
        duracionSegundos
      ) * 100

    );

    if(porcentaje > 100){

      porcentaje = 100;

    }

    barra.style.width =
    porcentaje + "%";

    textoProgreso.innerHTML =

    porcentaje +
    "% completado";

    await updateDoc(

      doc(
        db,
        "actividades",
        actId
      ),

      {

        progreso:porcentaje,

        tiempoTranscurrido:
        transcurrido

      }

    );

  },1000);

}


/* =========================
   FINALIZAR
========================= */

window.finalizar = async()=>{

  clearInterval(intervalo);

  await updateDoc(

    doc(
      db,
      "actividades",
      actId
    ),

    {

      estado:"finalizada",

      iniciada:false,

      progreso:100,

      fechaFin:
      new Date().toISOString()

    }

  );

  barra.style.width =
  "100%";

  textoProgreso.innerHTML =
  "100% completado";

  btnFinalizar.disabled = true;

  alert(
    "Actividad finalizada"
  );

};


/* =========================
   PROBLEMA
========================= */

window.reportarProblema = ()=>{

  window.location.href =

  `problema.html?actId=${actId}&nombre=${nombre}`;

};

</script>

</body>
</html>
