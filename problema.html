<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resolver Problema</title>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  background:white;
  padding:25px;
  border-radius:15px;
  width:400px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
}

select,
button,
textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  box-sizing:border-box;
}

textarea{
  resize:none;
  height:100px;
}

button{
  background:#2ecc71;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#27ae60;
}

.info{
  margin-top:15px;
  background:#f7f7f7;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}

</style>
</head>

<body>

<div class="container">

  <h2>Resolver problema</h2>

  <select id="tipo">

    <option value="">
      Selecciona problema
    </option>

    <option value="error_finalizar">
      Finalicé por error
    </option>

  </select>

  <textarea
    id="descripcion"
    placeholder="Describe el problema">
  </textarea>

  <button onclick="resolver()">
    Resolver
  </button>

  <div class="info">

    El administrador recibirá
    automáticamente el correo.

  </div>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  addDoc,
  collection
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";


// FIREBASE
const app = initializeApp({

  apiKey:"TU_API_KEY",

  authDomain:"agrotecdb.firebaseapp.com",

  projectId:"agrotecdb"

});

const db = getFirestore(app);


// EMAILJS
emailjs.init("1xgXkmn1R5msn0Tmo");


// PARAMS
const params =
  new URLSearchParams(window.location.search);

const actId =
  params.get("actId");


// ACTIVIDAD
let actividad = null;


// CARGAR ACTIVIDAD
async function cargar(){

  const snap =
    await getDoc(
      doc(db,"actividades",actId)
    );

  if(!snap.exists()){

    alert("Actividad no encontrada");

    return;

  }

  actividad = snap.data();

}

cargar();


// RESOLVER
window.resolver = async () => {

  const tipo =
    document.getElementById("tipo").value;

  const descripcion =
    document.getElementById("descripcion")
    .value
    .trim();

  if(!tipo){

    alert("Selecciona un problema");

    return;

  }

  try{

    // GUARDAR EN FIREBASE
    await addDoc(

      collection(
        db,
        "solicitudesReapertura"
      ),

      {

        actividadId:actId,

        actividad:
          actividad.nombre,

        trabajador:
          actividad.trabajador,

        zona:
          actividad.zona,

        descripcion:
          descripcion,

        fecha:
          new Date().toISOString(),

        estado:"pendiente"

      }

    );


    // ENVIAR CORREO
    const response =
   await emailjs.send(

  "service_1uiukzg",

  "template_4rr3rb8",

  {

    trabajador:
      actividad.trabajador,

    actividad:
      actividad.nombre,

    zona:
      actividad.zona,

    descripcion:
      descripcion,

    actividadId:
      actId

  }

);

    console.log(response);

    alert(
      "Correo enviado correctamente"
    );

    window.location.href =
      "index.html";

  }
  catch(error){

    console.error(error);

    alert(
      "Error al enviar correo"
    );

  }

};

</script>

</body>
</html>
