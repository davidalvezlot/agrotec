<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba EmailJS</title>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  padding:30px;
  border-radius:15px;
  width:350px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#3498db;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#2980b9;
}

</style>
</head>

<body>

<div class="container">

  <h2>Prueba EmailJS</h2>

  <button onclick="enviarCorreo()">
    Enviar correo de prueba
  </button>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

// INICIALIZAR EMAILJS
emailjs.init("1xgXkmn1R5msn0Tmo");


// ENVIAR CORREO
async function enviarCorreo(){

  try{

    const response = await emailjs.send(

      "service_1uiukzg",

      "template_4rr3rb8",

      {

        trabajador:"David",

        actividad:"Actividad de prueba",

        zona:"Zona A",

        descripcion:"Este es un correo de prueba enviado desde GitHub Pages",

        actividadId:"12345"

      }

    );

    console.log(response);

    alert("Correo enviado correctamente");

  }
  catch(error){

    console.error(error);

    alert(JSON.stringify(error));

  }

}

</script>

</body>
</html>
