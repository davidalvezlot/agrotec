<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resolver Problema</title>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  background:white;
  padding:25px;
  border-radius:15px;
  width:400px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
}

select,
button,
textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  box-sizing:border-box;
}

textarea{
  resize:none;
  height:100px;
}

button{
  background:#2ecc71;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#27ae60;
}

.info{
  margin-top:15px;
  background:#f7f7f7;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}

#recursos{
  margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

  <h2>Resolver problema</h2>

  <select id="tipo">

    <option value="">
      Selecciona problema
    </option>

    <option value="error_finalizar">
      Finalicé por error
    </option>

    <option value="falta_recurso">
      No había recurso
    </option>

  </select>

  <div id="recursos"></div>

  <textarea
    id="descripcion"
    placeholder="Describe el problema">
  </textarea>

 <button onclick="resolver()">
Enviar prueba
</button>

  <div class="info">

    Si la actividad fue finalizada por error,
    se enviará automáticamente un correo
    al administrador.

  </div>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">



emailjs.init("1xgXkmn1R5msn0Tmo");

async function resolver(){

  try{

    const response = await emailjs.send(

      "service_1uiukzg",

      "template_4rr3rb8",

      {

        trabajador:"David",

        actividad:"Prueba",

        zona:"Zona A",

        descripcion:"Correo de prueba",

        actividadId:"123"

      }

    );

    console.log(response);

    alert("Correo enviado correctamente");

  }
  catch(error){

    console.log(error);

    alert(JSON.stringify(error));

  }

}


</script>

</body>
</html>
