<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resolver Problema</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* =========================
   BODY
========================= */

body{
  font-family:'Inter',sans-serif;
  background:#eef2f6;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  color:#1e293b;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:100%;
  max-width:520px;
  background:#f8f8f9;
  border-radius:30px;
  padding:35px;
  box-shadow:0 10px 30px rgba(15,23,42,0.08);
}

/* =========================
   HEADER
========================= */

.header{
  margin-bottom:30px;
}

.header h2{
  font-size:34px;
  font-weight:800;
  color:#243247;
  margin-bottom:10px;
}

.header p{
  color:#64748b;
  font-size:15px;
  line-height:1.5;
}

/* =========================
   FORM
========================= */

.form-group{
  margin-bottom:22px;
}

label{
  display:block;
  margin-bottom:10px;
  font-size:14px;
  font-weight:700;
  color:#475569;
}

select,
textarea{
  width:100%;
  border:none;
  outline:none;
  background:white;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:16px;
  font-size:15px;
  font-family:'Inter',sans-serif;
  color:#1e293b;
  transition:0.2s;
}

select:focus,
textarea:focus{
  border-color:#243247;
}

textarea{
  resize:none;
  min-height:130px;
}

/* =========================
   RECURSOS
========================= */

#recursos{
  margin-bottom:22px;
}

/* =========================
   INFO BOX
========================= */

.info{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:18px;
  margin-top:20px;
  color:#64748b;
  font-size:14px;
  line-height:1.6;
}

/* =========================
   BUTTON
========================= */

button{
  width:100%;
  border:none;
  background:#243247;
  color:white;
  padding:16px;
  border-radius:18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
  margin-top:8px;
}

button:hover{
  opacity:0.92;
  transform:translateY(-1px);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .container{
    padding:25px;
    border-radius:24px;
  }

  .header h2{
    font-size:28px;
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h2>
      Resolver problema
    </h2>

    <p>
      Gestiona incidencias y solicita recursos o reapertura de actividades.
    </p>

  </div>

  <!-- FORM -->

  <div class="form-group">

    <label>
      Tipo de problema
    </label>

    <select id="tipo">

      <option value="">
        Selecciona problema
      </option>

      <option value="error_finalizar">
        Finalicé por error
      </option>

      <option value="falta_recurso">
        No había recurso
      </option>

    </select>

  </div>

  <!-- RECURSOS -->

  <div id="recursos"></div>

  <!-- DESCRIPCION -->

  <div class="form-group">

    <label>
      Descripción
    </label>

    <textarea
      id="descripcion"
      placeholder="Describe el problema">
    </textarea>

  </div>

  <!-- BUTTON -->

  <button onclick="resolver()">

    Resolver problema

  </button>

  <!-- INFO -->

  <div class="info">

    En caso de reapertura de actividad,
    el administrador deberá autorizarla.

  </div>

</div>

<!-- EMAILJS -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  collection,
  getDocs,
  addDoc
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/* =========================
   EMAILJS
========================= */

emailjs.init("1xgXkmn1R5msn0Tmo");

/* =========================
   FIREBASE
========================= */

const app = initializeApp({

  apiKey: "TU_API_KEY",

  authDomain: "agrotecdb.firebaseapp.com",

  projectId: "agrotecdb"

});

const db = getFirestore(app);

/* =========================
   PARAMS
========================= */

const params =
  new URLSearchParams(window.location.search);

const actId =
  params.get("actId");

/* =========================
   ELEMENTOS
========================= */

const tipoSelect =
  document.getElementById("tipo");

const contRecursos =
  document.getElementById("recursos");

let actividad = null;

let recursosDisponibles = [];

/* =========================
   CARGAR ACTIVIDAD
========================= */

async function cargar() {

  const snap =
    await getDoc(
      doc(db, "actividades", actId)
    );

  if (!snap.exists()) {

    alert("Actividad no encontrada");

    return;

  }

  actividad = snap.data();

}

cargar();

/* =========================
   CAMBIO DE PROBLEMA
========================= */

tipoSelect.addEventListener(
  "change",

  async () => {

    contRecursos.innerHTML = "";

    if (
      tipoSelect.value ===
      "falta_recurso"
    ) {

      const snap =
        await getDocs(
          collection(db, "recursos")
        );

      recursosDisponibles =
        snap.docs

        .map(d => ({
          id: d.id,
          ...d.data()
        }))

        .filter(r =>

          r.zona === actividad.zona &&

          r.estado === "disponible" &&

          r.tipo === actividad.tipo

        );

      if (
        recursosDisponibles.length === 0
      ) {

        contRecursos.innerHTML = `

          <div class="info">
            No hay recursos disponibles
          </div>

        `;

        return;

      }

      let html = `

        <div class="form-group">

          <label>
            Selecciona recurso
          </label>

          <select id="recurso">

      `;

      recursosDisponibles.forEach(r => {

        html += `

          <option value="${r.id}">
            ${r.nombre}
          </option>

        `;

      });

      html += `

          </select>

        </div>

      `;

      contRecursos.innerHTML = html;

    }

  }

);

/* =========================
   RESOLVER
========================= */

window.resolver = async () => {

  const tipo =
    tipoSelect.value;

  const descripcion =
    document
      .getElementById("descripcion")
      .value
      .trim();

  if (!tipo) {

    alert("Selecciona un problema");

    return;

  }

  /* =========================
     FINALIZÓ POR ERROR
  ========================= */

  if (
    tipo === "error_finalizar"
  ) {

    try {

      await addDoc(

        collection(
          db,
          "solicitudesReapertura"
        ),

        {

          actividadId:
            actId,

          actividad:
            actividad.nombre,

          trabajador:
            actividad.trabajador,

          zona:
            actividad.zona,

          descripcion:
            descripcion,

          estado:
            "pendiente",

          fecha:
            new Date().toISOString()

        }

      );

      const link =

`https://davidalvezlot.github.io/reabrir/?actId=${actId}`;

      await emailjs.send(

        "service_1uiukzg",

        "template_4rr3rb8",

        {

          trabajador:
            actividad.trabajador,

          actividad:
            actividad.nombre,

          zona:
            actividad.zona,

          descripcion:
            descripcion,

          actividadId:
            actId,

          link:
            link,

          to_email:
            "l24200787@pachuca.tecnm.mx"

        }

      );

      alert(
        "Solicitud enviada correctamente"
      );

      window.location.href =
        "index.html";

    }

    catch (error) {

      console.error(error);

      alert(
        "Error al enviar correo"
      );

    }

  }

  /* =========================
     FALTA DE RECURSO
  ========================= */

  if (
    tipo === "falta_recurso"
  ) {

    const recursoId =

      document
        .getElementById("recurso")
        ?.value;

    if (!recursoId) {

      alert(
        "Selecciona un recurso"
      );

      return;

    }

    const recurso =

      recursosDisponibles.find(
        r => r.id === recursoId
      );

    await updateDoc(

      doc(
        db,
        "actividades",
        actId
      ),

      {

        recursoAsignado:
          recurso.nombre,

        recursoId:
          recurso.id,

        estado:
          "en_proceso"

      }

    );

    await updateDoc(

      doc(
        db,
        "recursos",
        recurso.id
      ),

      {

        estado:
          "en_uso",

        asignadoA:
          actividad.trabajador

      }

    );

    alert(
      "Recurso asignado correctamente"
    );

    window.history.back();

  }

};

</script>

</body>
</html>
