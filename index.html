<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistencia</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
  width: 320px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 10px;
  width: 100%;
  background: #2ecc71;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #27ae60;
}

.estado {
  margin-top: 15px;
  font-weight: bold;
}

.info {
  font-size: 13px;
  color: #666;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

  <h3>Bienvenido</h3>
  <p>Inicia sesión</p>

  <input type="text" id="correo" placeholder="Correo">
  <input type="password" id="password" placeholder="Contraseña">

  <button onclick="login()">Ingresar</button>

  <div id="panelAsistencia" style="display:none;">
    <hr>

    <p id="nombreUsuario"></p>

    <button onclick="verificarUbicacion()">
      Registrar asistencia
    </button>

    <div class="info">
      Instituto Tecnológico de Pachuca
    </div>
  </div>

  <div class="estado" id="estado"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// FIREBASE
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "agrotecdb.firebaseapp.com",
  projectId: "agrotecdb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/*
COORDENADAS:
Instituto Tecnológico de Pachuca

20°05'02'' N
98°46'30'' O

Convertidas a decimal:
Latitud: 20.0839
Longitud: -98.7750
*/

// CENTRO
const LAT_CENTRO = 20.0839;
const LNG_CENTRO = -98.7750;

// RANGO PERMITIDO
// aproximadamente 300-400 metros
const MARGEN = 0.0040;

let usuarioActual = null;
let usuarioId = null;

// LOGIN
window.login = async () => {

  const correo = document.getElementById("correo").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!correo || !password) {
    alert("Completa todos los campos");
    return;
  }

  const snapshot = await getDocs(collection(db, "usuarios"));

  let encontrado = false;

  snapshot.forEach((docSnap) => {

    const data = docSnap.data();

    if (
      data.correo === correo &&
      data.password === password
    ) {

      usuarioActual = data;
      usuarioId = docSnap.id;
      encontrado = true;
    }

  });

  if (!encontrado) {
    alert("El correo o la contraseña no coinciden");
    return;
  }

  document.getElementById("panelAsistencia").style.display = "block";

  document.getElementById("nombreUsuario").innerText =
    "Hola " + usuarioActual.nombre;

  alert("Inicio de sesión exitoso");
};

// VERIFICAR UBICACIÓN
window.verificarUbicacion = () => {

  if (!usuarioId) {
    alert("Primero inicia sesión");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      console.log("Ubicación actual:", lat, lng);

      let estadoFinal = "inactivo";

      // VALIDAR DISTANCIA
      const dentroLat =
        lat >= (LAT_CENTRO - MARGEN) &&
        lat <= (LAT_CENTRO + MARGEN);

      const dentroLng =
        lng >= (LNG_CENTRO - MARGEN) &&
        lng <= (LNG_CENTRO + MARGEN);

      if (dentroLat && dentroLng) {
        estadoFinal = "activo";
      }

      // ACTUALIZAR FIREBASE
      await updateDoc(doc(db, "usuarios", usuarioId), {

        estadoHoy: estadoFinal,

        ultimaAsistencia: new Date().toISOString(),

        ubicacion: {
          latitud: lat,
          longitud: lng
        }

      });

      // MENSAJE
      document.getElementById("estado").innerText =

        estadoFinal === "activo"

        ? "Asistencia registrada correctamente"

        : "Fuera del área permitida";

    },

    (error) => {

      console.error(error);

      alert("Error al obtener ubicación");

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

};

</script>

</body>
</html>
