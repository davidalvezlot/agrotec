<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistencia</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
  width: 340px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 10px;
  width: 100%;
  background: #2ecc71;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #27ae60;
}

.estado {
  margin-top: 15px;
  font-weight: bold;
}

.info {
  font-size: 13px;
  color: #666;
  margin-top: 10px;
}

/* PROGRESO */
.panel-progreso{
  margin-top:20px;
  text-align:left;
}

.barra{
  width:100%;
  height:25px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progreso{
  height:100%;
  width:0%;
  background:#2ecc71;
  transition:0.4s;
}

.stats{
  margin-top:10px;
  font-size:14px;
  color:#444;
}

.completo{
  color:#27ae60;
  font-weight:bold;
}

.incompleto{
  color:#e67e22;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <h3>Bienvenido</h3>
  <p>Inicia sesión</p>

  <input type="text" id="correo" placeholder="Correo">
  <input type="password" id="password" placeholder="Contraseña">

  <button onclick="login()">Ingresar</button>

  <div id="panelAsistencia" style="display:none;">

    <hr>

    <p id="nombreUsuario"></p>

    <button onclick="verificarUbicacion()">
      Registrar asistencia
    </button>

    <div class="info">
      Instituto Tecnológico de Pachuca
    </div>

    <!-- PROGRESO -->
    <div class="panel-progreso">

      <h4>Progreso diario</h4>

      <div class="barra">
        <div class="progreso" id="barraProgreso"></div>
      </div>

      <div class="stats">
        <p>
          Actividades completadas:
          <strong id="actividadesCompletadas">0</strong>/3
        </p>

        <p>
          Horas trabajadas:
          <strong id="horasTrabajadas">0</strong>/6
        </p>

        <p id="estadoJornada" class="incompleto">
          Jornada incompleta
        </p>
      </div>

    </div>

  </div>

  <div class="estado" id="estado"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  query,
  where,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// FIREBASE
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "agrotecdb.firebaseapp.com",
  projectId: "agrotecdb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/*
Instituto Tecnológico de Pachuca
*/

const LAT_CENTRO = 20.0839;
const LNG_CENTRO = -98.7750;

const MARGEN = 0.0040;

let usuarioActual = null;
let usuarioId = null;

// LOGIN
window.login = async () => {

  const correo = document.getElementById("correo").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!correo || !password) {
    alert("Completa todos los campos");
    return;
  }

  const snapshot = await getDocs(collection(db, "usuarios"));

  let encontrado = false;

  snapshot.forEach((docSnap) => {

    const data = docSnap.data();

    if (
      data.correo === correo &&
      data.password === password
    ) {

      usuarioActual = data;
      usuarioId = docSnap.id;
      encontrado = true;
    }

  });

  if (!encontrado) {
    alert("El correo o la contraseña no coinciden");
    return;
  }

  document.getElementById("panelAsistencia").style.display = "block";

  document.getElementById("nombreUsuario").innerText =
    "Hola " + usuarioActual.nombre;

  cargarProgreso();

  alert("Inicio de sesión exitoso");
};

// PROGRESO EN TIEMPO REAL
function cargarProgreso() {

  const hoy = new Date().toISOString().split("T")[0];

  const q = query(
    collection(db, "actividades"),
    where("usuarioId", "==", usuarioId)
  );

  onSnapshot(q, (snapshot) => {

    let actividadesFinalizadas = 0;
    let horasTotales = 0;

    snapshot.forEach((docSnap) => {

      const act = docSnap.data();

      if (
        act.estado === "finalizada" &&
        act.fechaFin
      ) {

        const fechaActividad =
          act.fechaFin.split("T")[0];

        if (fechaActividad === hoy) {

          actividadesFinalizadas++;

          horasTotales += Number(
            act.duracionHoras || 0
          );
        }

      }

    });

    // ACTIVIDADES
    document.getElementById(
      "actividadesCompletadas"
    ).innerText = actividadesFinalizadas;

    // HORAS
    document.getElementById(
      "horasTrabajadas"
    ).innerText = horasTotales.toFixed(1);

    // PORCENTAJE
    let porcentajeActividades =
      (actividadesFinalizadas / 3) * 100;

    let porcentajeHoras =
      (horasTotales / 6) * 100;

    let porcentajeFinal =
      (porcentajeActividades + porcentajeHoras) / 2;

    if (porcentajeFinal > 100) {
      porcentajeFinal = 100;
    }

    document.getElementById(
      "barraProgreso"
    ).style.width = porcentajeFinal + "%";

    // ESTADO
    const estado = document.getElementById("estadoJornada");

    if (
      actividadesFinalizadas >= 3 &&
      horasTotales >= 6
    ) {

      estado.innerText =
        "Jornada completada";

      estado.className = "completo";

    } else {

      estado.innerText =
        "Jornada incompleta";

      estado.className = "incompleto";
    }

  });

}

// VERIFICAR UBICACIÓN
window.verificarUbicacion = () => {

  if (!usuarioId) {
    alert("Primero inicia sesión");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      let estadoFinal = "inactivo";

      const dentroLat =
        lat >= (LAT_CENTRO - MARGEN) &&
        lat <= (LAT_CENTRO + MARGEN);

      const dentroLng =
        lng >= (LNG_CENTRO - MARGEN) &&
        lng <= (LNG_CENTRO + MARGEN);

      if (dentroLat && dentroLng) {
        estadoFinal = "activo";
      }

      await updateDoc(doc(db, "usuarios", usuarioId), {

        estadoHoy: estadoFinal,

        ultimaAsistencia: new Date().toISOString(),

        ubicacion: {
          latitud: lat,
          longitud: lng
        }

      });

      document.getElementById("estado").innerText =

        estadoFinal === "activo"

        ? "Asistencia registrada correctamente"

        : "Fuera del área permitida";

    },

    (error) => {

      console.error(error);

      alert("Error al obtener ubicación");

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

};

</script>

</body>
</html>
