<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistencia</title>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
  width:420px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
  width:90%;
  padding:10px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:5px;
}

button{
  padding:12px;
  width:100%;
  background:#2ecc71;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin-top:10px;
}

button:hover{
  background:#27ae60;
}

.estado{
  margin-top:15px;
  font-weight:bold;
}

.info{
  font-size:13px;
  color:#666;
  margin-top:10px;
}

/* PROGRESO */
.panel-progreso{
  margin-top:20px;
  text-align:left;
}

.barra{
  width:100%;
  height:25px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progreso{
  height:100%;
  width:0%;
  background:#2ecc71;
  transition:0.4s;
}

.stats{
  margin-top:10px;
  font-size:14px;
  color:#444;
}

.completo{
  color:#27ae60;
  font-weight:bold;
}

.incompleto{
  color:#e67e22;
  font-weight:bold;
}

/* ACTIVIDAD */
.actividad-box{
  margin-top:20px;
  background:#f7f9fc;
  padding:15px;
  border-radius:12px;
  text-align:left;
}

.actividad-box h4{
  margin-top:0;
}

.en_proceso{
  color:#f39c12;
  font-weight:bold;
}

.finalizada{
  color:#2980b9;
  font-weight:bold;
}

.dato{
  margin-top:8px;
  font-size:15px;
}

.restante{
  color:#e74c3c;
  font-weight:bold;
}

.completado{
  color:#27ae60;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

  <h3>Bienvenido</h3>

  <p>Inicia sesión</p>

  <input
    type="text"
    id="correo"
    placeholder="Correo">

  <input
    type="password"
    id="password"
    placeholder="Contraseña">

  <button onclick="login()">
    Ingresar
  </button>

  <div id="panelAsistencia" style="display:none;">

    <hr>

    <p id="nombreUsuario"></p>

    <button onclick="verificarUbicacion()">
      Registrar asistencia
    </button>

    <div class="info">
      Instituto Tecnológico de Pachuca
    </div>

    <!-- ACTIVIDAD -->
    <div class="actividad-box">

      <h4>
        Actividad actual
      </h4>

      <div class="dato">

        <strong>Actividad:</strong>

        <span id="actividadActual">
          Sin actividad
        </span>

      </div>

      <div class="dato">

        <strong>Estado:</strong>

        <span id="estadoActividad">
          Inactivo
        </span>

      </div>

      <div class="dato">

        <strong>Progreso:</strong>

        <span id="progresoActual">
          0%
        </span>

      </div>

      <div class="dato">

        <strong>Horas completadas:</strong>

        <span id="horasCompletadas">
          0
        </span>

      </div>

      <div class="dato restante">

        <strong>Horas faltantes:</strong>

        <span id="horasRestantes">
          6
        </span>

      </div>

    </div>

    <!-- PROGRESO -->
    <div class="panel-progreso">

      <h4>
        Progreso diario
      </h4>

      <div class="barra">

        <div
          class="progreso"
          id="barraProgreso">

        </div>

      </div>

      <div class="stats">

        <p>

          Actividades finalizadas:

          <strong id="actividadesCompletadas">
            0
          </strong>/3

        </p>

        <p>

          Horas trabajadas:

          <strong id="horasTrabajadas">
            0
          </strong>/6

        </p>

        <p>

          Horas faltantes:

          <strong id="horasFaltantes">
            6
          </strong>

        </p>

        <p id="estadoJornada"
           class="incompleto">

          Jornada incompleta

        </p>

      </div>

    </div>

  </div>

  <div class="estado" id="estado"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {

  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  query,
  where,
  onSnapshot

}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";


// FIREBASE
const firebaseConfig = {

  apiKey:"TU_API_KEY",

  authDomain:"agrotecdb.firebaseapp.com",

  projectId:"agrotecdb"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


// UBICACION
const LAT_CENTRO = 20.0839;

const LNG_CENTRO = -98.7750;

const MARGEN = 0.0040;


let usuarioActual = null;

let usuarioId = null;


// LOGIN
window.login = async()=>{

  const correo =
  document
  .getElementById("correo")
  .value
  .trim();

  const password =
  document
  .getElementById("password")
  .value
  .trim();

  if(!correo || !password){

    alert(
      "Completa todos los campos"
    );

    return;

  }

  const snapshot =
  await getDocs(
    collection(db,"usuarios")
  );

  let encontrado = false;

  snapshot.forEach((docSnap)=>{

    const data = docSnap.data();

    if(

      data.correo === correo &&

      data.password === password

    ){

      usuarioActual = data;

      usuarioId = docSnap.id;

      encontrado = true;

    }

  });

  if(!encontrado){

    alert(
      "El correo o contraseña no coinciden"
    );

    return;

  }

  document
  .getElementById("panelAsistencia")
  .style.display = "block";

  document
  .getElementById("nombreUsuario")
  .innerText =
  "Hola " + usuarioActual.nombre;

  cargarProgreso();

  alert(
    "Inicio de sesión exitoso"
  );

};


// PROGRESO TIEMPO REAL
function cargarProgreso(){

  const hoy =
  new Date()
  .toISOString()
  .split("T")[0];

  const q = query(

    collection(db,"actividades"),

    where(
      "usuarioId",
      "==",
      usuarioId
    )

  );

  onSnapshot(q,(snapshot)=>{

    let actividadesFinalizadas = 0;

    let horasTotales = 0;

    let actividadActiva = null;

    snapshot.forEach((docSnap)=>{

      const act =
      docSnap.data();

      // ACTIVIDAD ACTIVA
      if(
        act.estado === "en_proceso"
      ){

        actividadActiva = act;

      }

      // FINALIZADAS
      if(

        act.estado === "finalizada" &&

        act.fechaFin

      ){

        const fechaActividad =

        act.fechaFin
        .split("T")[0];

        if(
          fechaActividad === hoy
        ){

          actividadesFinalizadas++;

          const progreso =
          Number(
            act.progreso || 0
          );

          const horas =
          Number(
            act.duracionHoras || 2
          );

          // HORAS REALES
          const horasReales =
          (
            horas *
            progreso
          ) / 100;

          horasTotales +=
          horasReales;

        }

      }

    });


    // ACTIVIDAD ACTUAL
    if(actividadActiva){

      const progresoActual =
      Number(
        actividadActiva.progreso || 0
      );

      const horasActividad =
      Number(
        actividadActiva.duracionHoras || 2
      );

      const horasCompletadas =
      (
        horasActividad *
        progresoActual
      ) / 100;

      document
      .getElementById("actividadActual")
      .innerText =

      actividadActiva.nombre ||
      "Actividad";

      document
      .getElementById("estadoActividad")
      .innerHTML =

      `<span class="en_proceso">
        En proceso
      </span>`;

      document
      .getElementById("progresoActual")
      .innerText =

      progresoActual + "%";

      document
      .getElementById("horasCompletadas")
      .innerText =

      horasCompletadas.toFixed(2)
      + " horas";

    }else{

      document
      .getElementById("actividadActual")
      .innerText =
      "Sin actividad";

      document
      .getElementById("estadoActividad")
      .innerHTML =

      `<span class="finalizada">
        Inactivo
      </span>`;

      document
      .getElementById("progresoActual")
      .innerText =
      "0%";

      document
      .getElementById("horasCompletadas")
      .innerText =
      "0 horas";

    }


    // HORAS RESTANTES
    let faltantes =
    6 - horasTotales;

    if(faltantes < 0){
      faltantes = 0;
    }


    // ACTIVIDADES
    document
    .getElementById(
      "actividadesCompletadas"
    )
    .innerText =
    actividadesFinalizadas;


    // HORAS
    document
    .getElementById(
      "horasTrabajadas"
    )
    .innerText =
    horasTotales.toFixed(2);


    // FALTANTES
    document
    .getElementById(
      "horasFaltantes"
    )
    .innerText =
    faltantes.toFixed(2);

    document
    .getElementById(
      "horasRestantes"
    )
    .innerText =
    faltantes.toFixed(2)
    + " horas";


    // PORCENTAJE TOTAL
    let porcentajeHoras =

      (
        horasTotales / 6
      ) * 100;

    if(
      porcentajeHoras > 100
    ){

      porcentajeHoras = 100;

    }

    document
    .getElementById("barraProgreso")
    .style.width =

    porcentajeHoras + "%";


    // ESTADO
    const estado =

    document.getElementById(
      "estadoJornada"
    );

    if(
      horasTotales >= 6
    ){

      estado.innerText =
      "Jornada completada";

      estado.className =
      "completado";

    }else{

      estado.innerText =

      "Faltan " +
      faltantes.toFixed(2) +
      " horas para completar la jornada";

      estado.className =
      "incompleto";

    }

  });

}


// UBICACION
window.verificarUbicacion = ()=>{

  if(!usuarioId){

    alert(
      "Primero inicia sesión"
    );

    return;

  }

  navigator.geolocation
  .getCurrentPosition(

    async(pos)=>{

      const lat =
      pos.coords.latitude;

      const lng =
      pos.coords.longitude;

      let estadoFinal =
      "inactivo";

      const dentroLat =

      lat >=
      (LAT_CENTRO - MARGEN)

      &&

      lat <=
      (LAT_CENTRO + MARGEN);

      const dentroLng =

      lng >=
      (LNG_CENTRO - MARGEN)

      &&

      lng <=
      (LNG_CENTRO + MARGEN);

      if(
        dentroLat &&
        dentroLng
      ){

        estadoFinal = "activo";

      }

      await updateDoc(

        doc(
          db,
          "usuarios",
          usuarioId
        ),

        {

          estadoHoy:
          estadoFinal,

          ultimaAsistencia:
          new Date().toISOString(),

          ubicacion:{

            latitud:lat,

            longitud:lng

          }

        }

      );

      document
      .getElementById("estado")
      .innerText =

      estadoFinal === "activo"

      ? "Asistencia registrada correctamente"

      : "Fuera del área permitida";

    },

    (error)=>{

      console.error(error);

      alert(
        "Error al obtener ubicación"
      );

    },

    {

      enableHighAccuracy:true,

      timeout:10000,

      maximumAge:0

    }

  );

};

</script>

</body>
</html>
